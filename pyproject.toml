[project]
name = "handwriting-ocr-mcp"
version = "0.1.0"
description = "MCP server for handwriting OCR using Google Vision API and Tesseract"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "google-cloud-vision",
    "Pillow",
    "python-dotenv",
]

[project.optional-dependencies]
tesseract = ["pytesseract"]
dev = ["pytest", "ruff"]

[project.scripts]
handwriting-ocr-mcp = "handwriting_ocr_mcp.server:mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handwriting_ocr_mcp"]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
